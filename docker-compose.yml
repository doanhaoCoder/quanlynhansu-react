version: '3.8'

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-app-container
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: npm start
    working_dir: /app
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
